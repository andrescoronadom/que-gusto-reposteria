<style>
:root {
  --surface: #FDF9F2;
  --surface-sunken: #F5EDDF;
  --surface-inverse: #4A1E51;
  --ink: #2E1A16;
  --ink-soft: #6B5750;
  --ink-brand: #4A1E51;
  --ink-on-inverse: #FDF9F2;
  --action: #4A1E51;
  --action-hover: #5C2764;
  --action-pressed: #3A1741;
  --on-action: #FDF9F2;
  --link: #1E40AF;
  --link-hover: #173292;
  --ink-eyebrow: #1E40AF;
  --accent-fresh: #BCE9D6;
  --on-accent-fresh: #4A1E51;
  --accent-warm: #C25E3A;
  --accent-warm-text: #A64B2B;
  --accent-on-inverse: #FCE794;
  --border-strong: #4A1E51;
  --hairline: rgb(74 30 81 / 16%);
  --focus-ring: #1E40AF;
  --focus-ring-inverse: #BCE9D6;
  --line-inmediata: #FCE794;
  --line-experiencia: #BCE9D6;
  --line-regalo: #F7B5CD;
  --line-gourmet: #8EA873;
  --success-bg: #BCE9D6;
  --on-success: #4A1E51;
  --notice-bg: #FCE794;
  --error: #A64B2B;
  --disabled-bg: #EDE4D4;
  --disabled-ink: #685c63;
  --scrim: rgb(46 26 22 / 56%);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;
  --shadow-overlay: 0 12px 32px rgb(46 26 22 / 18%);
  --touch-target: 48px;
  --control-height: 52px;
  --icon-md: 24px;
  --logo-height: 40px;
  --border-hairline: 1px;
  --border-control: 2px;
  --focus-ring-width: 3px;
  --z-sticky: 10;
  --font-display: "Caprasimo", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3, p, ul { margin: 0; }
a { color: var(--link); }
a:hover { color: var(--link-hover); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
[hidden] { display: none !important; }

.display-hero { font-family: var(--font-display); font-size: 40px; line-height: 1.08; font-weight: 400; }
.heading-lg { font-family: var(--font-display); font-size: 32px; line-height: 1.18; font-weight: 400; }
.heading-md { font-family: var(--font-display); font-size: 24px; line-height: 1.25; font-weight: 400; }
.heading-sm { font-family: var(--font-body); font-size: 20px; line-height: 1.3; font-weight: 700; }
.price { font-family: var(--font-body); font-size: 22px; line-height: 1.2; font-weight: 700; }
.body-lg { font-size: 18px; line-height: 1.55; }
.body { font-size: 16px; line-height: 1.5; }
.body-strong { font-size: 16px; line-height: 1.5; font-weight: 700; }
.body-sm { font-size: 14px; line-height: 1.45; }
.label { font-size: 14px; line-height: 1.45; font-weight: 700; }
.caption { font-size: 12px; line-height: 1.35; font-weight: 500; }
.eyebrow { font-size: 12px; line-height: 1.35; font-weight: 700; letter-spacing: .1em; }

.wrap { display: flex; max-width: 1120px; flex-direction: column; gap: 24px; margin: 0 auto; padding: 32px 16px 64px; }
.narrow { max-width: 720px; }
.center { align-items: center; text-align: center; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 24px; }
.cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; }
.cols > * { flex: 1 1 360px; min-width: 0; }
.form { display: flex; flex-direction: column; gap: 16px; }
.bar { position: sticky; bottom: 12px; display: flex; justify-content: center; }
.bar .qg-btn { box-shadow: var(--shadow-overlay); }
.head-inner { display: flex; width: 100%; max-width: 1120px; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; color: inherit; text-decoration: none; }
.brand .heading-md { color: var(--ink-brand); }
.muted { color: var(--ink-soft); }
.brandc { color: var(--ink-brand); }

.qg-surface { min-height: 100vh; background: var(--surface); color: var(--ink); font-family: var(--font-body); }
.qg-eyebrow { color: var(--ink-eyebrow); text-transform: uppercase; }
.qg-icon { width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.qg-price { color: var(--accent-warm-text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qg-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.qg-hero { position: relative; isolation: isolate; overflow: hidden; display: flex; min-height: 260px; align-items: center; border-radius: var(--radius-xl); padding: clamp(24px, 6vw, 48px); background: var(--accent-fresh); }
.qg-hero::after { position: absolute; z-index: -1; right: -54px; bottom: -96px; width: 250px; height: 250px; border: 2px dashed rgb(74 30 81 / 24%); border-radius: 50%; content: ""; }
.qg-hero__copy { display: flex; max-width: 660px; flex-direction: column; align-items: flex-start; gap: var(--space-3); }
.qg-hero__title { max-width: 620px; font-size: clamp(36px, 7vw, 58px); line-height: 1.03; }
.qg-hero__description { max-width: 500px; color: var(--ink-brand); }
.qg-hero__note { display: inline-flex; align-items: center; gap: var(--space-2); border: 1px solid rgb(74 30 81 / 16%); border-radius: var(--radius-pill); padding: 7px 12px; background: rgb(253 249 242 / 72%); color: var(--ink-brand); }
.qg-hero__note::before { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); content: ""; }
.qg-catalog-section { display: flex; flex-direction: column; gap: var(--space-4); }
.qg-catalog-intro { display: flex; align-items: end; justify-content: space-between; gap: var(--space-4); }
.qg-catalog-intro__copy { display: flex; flex-direction: column; gap: var(--space-2); }
.qg-catalog-intro__aside { max-width: 290px; color: var(--ink-soft); text-align: right; }

.qg-btn { display: inline-flex; min-height: var(--touch-target); align-items: center; justify-content: center; gap: var(--space-2); border: var(--border-control) solid transparent; border-radius: var(--radius-pill); padding: 0 var(--space-5); background: transparent; color: inherit; font-family: var(--font-body); font-size: 16px; font-weight: 700; text-align: center; text-decoration: none; white-space: nowrap; transition: background-color .18s ease-out, border-color .18s ease-out, transform .18s ease-out; }
.qg-btn:active { transform: scale(.98); }
.qg-btn:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 3px; }
.qg-btn--primary { background: var(--action); color: var(--on-action); }
.qg-btn--primary:hover { background: var(--action-hover); color: var(--on-action); }
.qg-btn--primary:active { background: var(--action-pressed); color: var(--on-action); }
.qg-btn--fresh { background: var(--accent-fresh); color: var(--on-accent-fresh); }
.qg-btn--fresh:hover { border-color: var(--border-strong); }
.qg-btn--secondary { border-color: var(--border-strong); color: var(--ink-brand); }
.qg-btn--secondary:hover { background: var(--surface-sunken); }
.qg-btn--ghost { padding: 0 var(--space-3); color: var(--link); }
.qg-btn--ghost:hover { background: var(--surface-sunken); color: var(--link-hover); }
.qg-btn--lg { min-height: var(--control-height); }
.qg-btn--block { display: flex; width: 100%; }
.qg-btn--icon { width: var(--touch-target); padding: 0; }
.qg-btn[disabled], .qg-btn[aria-disabled="true"] { transform: none; border-color: transparent; background: var(--disabled-bg); color: var(--disabled-ink); cursor: not-allowed; }
.on-inverse .qg-btn:focus-visible { outline-color: var(--focus-ring-inverse); }

.qg-tag { display: inline-flex; align-items: center; gap: var(--space-1); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); background: var(--surface-sunken); color: var(--ink); }
.qg-tag--inmediata { background: var(--line-inmediata); }
.qg-tag--experiencia { background: var(--line-experiencia); }
.qg-tag--regalo { background: var(--line-regalo); }
.qg-tag--gourmet { background: var(--line-gourmet); }
.qg-tag--selected { background: var(--action); color: var(--on-action); }

.qg-header { position: sticky; z-index: var(--z-sticky); top: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); border-bottom: var(--border-hairline) solid var(--hairline); padding: var(--space-2) var(--space-4); background: var(--surface); }
.qg-header__logo { display: block; width: auto; height: var(--logo-height); }
.qg-header__title { flex: 1; min-width: 0; }
.qg-cartbtn { position: relative; }
.qg-cartbtn__count { position: absolute; top: -4px; right: -4px; display: inline-flex; min-width: var(--space-5); height: var(--space-5); align-items: center; justify-content: center; border-radius: var(--radius-pill); padding: 0 var(--space-1); background: var(--accent-warm-text); color: var(--on-action); font-variant-numeric: tabular-nums; }
.qg-cartbtn__count.is-bump { animation: qg-bump .24s ease-out; }
@keyframes qg-bump { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

.qg-banner { display: flex; align-items: flex-start; gap: var(--space-3); border-radius: var(--radius-md); padding: var(--space-4); background: var(--notice-bg); color: var(--ink); }
.qg-banner--open { background: var(--success-bg); color: var(--on-success); }
.qg-banner .qg-icon { margin-top: var(--space-1); }
.qg-banner__text { display: flex; min-width: 0; flex-direction: column; gap: var(--space-1); }

.qg-card { display: flex; min-width: 0; flex-direction: column; overflow: hidden; border: var(--border-control) solid var(--hairline); border-radius: var(--radius-lg); background: var(--surface); transition: border-color .18s ease-out; }
.qg-card:hover { border-color: rgb(74 30 81 / 38%); }
.qg-card--selected { border-color: var(--link); }
.qg-card__media { position: relative; max-width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--line-inmediata); }
.qg-card__media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.qg-card__disc { position: absolute; right: calc(var(--space-6) * -1); bottom: calc(var(--space-6) * -1); width: calc(var(--space-8) * 2); height: calc(var(--space-8) * 2); border-radius: 50%; background: var(--surface); opacity: .45; }
.qg-card__ph { position: absolute; bottom: var(--space-3); left: var(--space-4); color: var(--ink-soft); }
.qg-card__tags { position: absolute; top: var(--space-3); left: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2); }
.qg-card__body { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: var(--space-2); padding: var(--space-4); }
.qg-card__title { margin: 0; color: var(--ink-brand); }
.qg-card__desc { margin: 0; color: var(--ink); }
.qg-card__footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); margin-top: auto; padding: 0 var(--space-4) var(--space-4); }
.qg-card__ph { border-radius: var(--radius-pill); padding: 5px 9px; background: rgb(253 249 242 / 78%); }

.qg-options { display: flex; min-width: 0; flex-wrap: wrap; gap: var(--space-2); margin: 0; padding: 0; border: 0; }
.qg-option { position: relative; display: inline-flex; min-width: 0; }
.qg-option input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.qg-option__face { display: flex; min-height: var(--touch-target); flex-direction: column; justify-content: center; border: var(--border-control) solid var(--border-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); background: var(--surface); color: var(--ink-brand); transition: background-color .18s ease-out; }
.qg-option input:hover + .qg-option__face { background: var(--surface-sunken); }
.qg-option input:checked + .qg-option__face { border-color: var(--action); background: var(--action); color: var(--on-action); }
.qg-option input:focus-visible + .qg-option__face { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 3px; }
.qg-option__sub { color: inherit; opacity: 1; }

.qg-stepper { display: inline-flex; align-items: center; border: var(--border-control) solid var(--border-strong); border-radius: var(--radius-pill); background: var(--surface); }
.qg-stepper__btn { display: inline-flex; width: var(--touch-target); height: var(--touch-target); align-items: center; justify-content: center; border: 0; border-radius: var(--radius-pill); padding: 0; background: transparent; color: var(--ink-brand); }
.qg-stepper__btn:hover { background: var(--surface-sunken); }
.qg-stepper__btn:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: -3px; }
.qg-stepper__btn[disabled] { background: transparent; color: var(--disabled-ink); cursor: not-allowed; }
.qg-stepper__value { min-width: var(--space-7); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }

.qg-cart { display: flex; min-width: 0; flex-direction: column; gap: var(--space-4); }
.qg-cart__line { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-2) var(--space-3); border-bottom: var(--border-hairline) solid var(--hairline); padding-bottom: var(--space-4); }
.qg-cart__name { margin: 0; color: var(--ink-brand); }
.qg-cart__meta { margin: 0; color: var(--ink-soft); }
.qg-cart__line-total { text-align: right; }
.qg-cart__totals { display: flex; flex-direction: column; gap: var(--space-2); border-radius: var(--radius-md); padding: var(--space-4); background: var(--surface-sunken); }
.qg-cart__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
.qg-sheet { border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: var(--space-5) var(--space-4); background: var(--surface); box-shadow: var(--shadow-overlay); }

.qg-field { display: flex; min-width: 0; flex-direction: column; gap: var(--space-2); }
.qg-field__label { color: var(--ink); }
.qg-field__hint { margin: 0; color: var(--ink-soft); }
.qg-field__error { display: none; align-items: flex-start; gap: var(--space-2); margin: 0; color: var(--error); }
.qg-field__error .qg-icon { width: 18px; height: 18px; }
.qg-field[data-invalid="true"] .qg-field__error { display: flex; }
.qg-input, .qg-select, .qg-textarea { width: 100%; min-height: var(--control-height); border: var(--border-control) solid var(--border-strong); border-radius: var(--radius-md); padding: 0 var(--space-4); background: var(--surface); color: var(--ink); }
.qg-textarea { min-height: calc(var(--control-height) * 2); padding: var(--space-3) var(--space-4); resize: vertical; }
.qg-input::placeholder, .qg-textarea::placeholder { color: var(--ink-soft); opacity: 1; }
.qg-input:focus-visible, .qg-select:focus-visible, .qg-textarea:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 2px; border-color: var(--link); }
.qg-field[data-invalid="true"] .qg-input, .qg-field[data-invalid="true"] .qg-select, .qg-field[data-invalid="true"] .qg-textarea { border-color: var(--error); }

.qg-status { display: flex; align-items: flex-start; gap: var(--space-2); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
.qg-status--error { background: #fae9e7; color: #842e2a; }
.qg-status--success { background: var(--success-bg); color: var(--on-success); }
.qg-status .qg-icon { width: 20px; height: 20px; }

.qg-steps { display: flex; flex-wrap: wrap; gap: var(--space-4); margin: 0; border-radius: var(--radius-lg); padding: var(--space-5); background: var(--surface-inverse); color: var(--ink-on-inverse); list-style: none; }
.qg-steps li { display: flex; min-width: 0; flex: 1 1 140px; align-items: flex-start; gap: var(--space-3); }
.qg-steps__num { display: inline-flex; width: var(--space-6); height: var(--space-6); flex: none; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent-fresh); color: var(--link); }
.qg-steps__title { margin: 0; color: var(--accent-on-inverse); text-transform: uppercase; }
.qg-steps__text { margin: 0; color: var(--ink-on-inverse); }

@media (max-width: 640px) {
  .display-hero { font-size: 32px; }
  .wrap { gap: 20px; padding-top: 24px; }
  .qg-hero { min-height: 240px; border-radius: var(--radius-lg); }
  .qg-hero__title { font-size: 38px; }
  .qg-catalog-intro { align-items: flex-start; flex-direction: column; }
  .qg-catalog-intro__aside { max-width: none; text-align: left; }
  .qg-cart__line { grid-template-columns: minmax(0, 1fr) auto; }
  .qg-cart__line .qg-stepper, .qg-cart__line [data-remove] { grid-column: 2; }
  .qg-cart__line .qg-stepper { grid-row: 2; }
  .qg-cart__line [data-remove] { grid-row: 3; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .qg-btn, .qg-card, .qg-option__face { transition: none; }
  .qg-btn:active { transform: none; }
  .qg-cartbtn__count.is-bump { animation: none; }
}
</style>
