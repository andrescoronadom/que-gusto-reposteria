<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDF9F2">
  <title>Vista previa · Qué Gusto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .preview-notice {
      position: relative;
      z-index: 20;
      padding: 8px 16px;
      background: #FCE794;
      color: #4A1E51;
      font: 600 13px/1.4 "DM Sans", sans-serif;
      text-align: center;
    }
    .preview-error {
      margin: 24px;
      border: 1px solid #A64B2B;
      border-radius: 12px;
      padding: 16px;
      color: #842e2a;
      font: 16px/1.5 "DM Sans", sans-serif;
    }
  </style>
</head>
<body>
  <div class="preview-notice">Vista previa local · productos de muestra · no se guardan pedidos en Google Sheets</div>
  <div id="app" class="qg-surface"></div>
  <script>
    const sampleProducts = [
      {
        id: 'demo-cookie',
        nombre: 'Cookie doble chocolate',
        categoria: 'Qué Cookies',
        descripcion: 'Suave por dentro, con chocolate y hecha con mantequilla real.',
        precio: 12000,
        imagen: ''
      },
      {
        id: 'demo-roll',
        nombre: 'Rollo de canela',
        categoria: 'Qué Rollos',
        descripcion: 'Masa tierna, canela aromática y glaseado artesanal.',
        precio: 14000,
        imagen: ''
      },
      {
        id: 'demo-cake',
        nombre: 'Bizcocho de vainilla',
        categoria: 'Qué Bizcocho',
        descripcion: 'Horneado a su tiempo para acompañar una pausa rica.',
        precio: 28000,
        imagen: ''
      }
    ];

    const scriptRun = {
      successHandler: null,
      failureHandler: null,
      withSuccessHandler(handler) {
        this.successHandler = handler;
        return this;
      },
      withFailureHandler(handler) {
        this.failureHandler = handler;
        return this;
      },
      obtenerProductosActivos() {
        window.setTimeout(() => this.successHandler(JSON.stringify(sampleProducts)), 100);
      },
      procesarPedido(payloadJSON) {
        const order = JSON.parse(payloadJSON);
        window.setTimeout(() => this.successHandler({
          status: 'success',
          orderId: 'QG-DEMO-0001',
          fecha: order.fechaEntrega,
          avisos: []
        }), 500);
      }
    };

    window.google = { script: { run: scriptRun } };

    async function loadPreview() {
      try {
        const [stylesResponse, appResponse] = await Promise.all([
          fetch('./styles.html'),
          fetch('./app.html')
        ]);
        if (!stylesResponse.ok || !appResponse.ok) {
          throw new Error('No se pudieron cargar los archivos de la vista previa.');
        }

        const stylesDocument = new DOMParser().parseFromString(await stylesResponse.text(), 'text/html');
        const appDocument = new DOMParser().parseFromString(await appResponse.text(), 'text/html');
        const style = stylesDocument.querySelector('style');
        const script = appDocument.querySelector('script');
        if (!style || !script) throw new Error('Falta el bloque de estilos o el script de la app.');

        document.head.append(style);
        const appScript = document.createElement('script');
        appScript.textContent = script.textContent;
        document.body.append(appScript);
      } catch (error) {
        const message = document.createElement('p');
        message.className = 'preview-error';
        message.textContent = error.message;
        document.body.append(message);
      }
    }

    loadPreview();
  </script>
</body>
</html>
